<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Unity 2D - Super Mario</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f1015;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #header {
    margin-bottom: 8px;
    text-align: center;
  }
  #header h1 {
    font-size: 24px;
    letter-spacing: 2px;
    color: #ffcc00;
    text-shadow: 2px 2px #d32f2f;
  }
  #canvas-container {
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    border: 4px solid #333;
    border-radius: 8px;
    background: #5c94fc;
    overflow: hidden;
    transition: background 0.5s ease;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #instructions {
    margin-top: 10px;
    font-size: 13px;
    color: #aaa;
    display: flex;
    gap: 20px;
    background: rgba(255,255,255,0.06);
    padding: 8px 18px;
    border-radius: 6px;
  }
  #instructions span { color: #fff; font-weight: bold; }
  .btn {
    background: #e52521;
    color: white;
    border: none;
    padding: 6px 14px;
    font-family: inherit;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 3px 0 #991510;
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #991510;
  }
</style>
</head>
<body>

<div id="header">
  <h1 id="header-title">SUPER UNITY in 2D &bull; WORLD 1-1</h1>
</div>

<div id="canvas-container">
  <canvas id="gameCanvas" width="960" height="480"></canvas>
</div>

<div id="instructions">
  <div><span>Move:</span> &larr; &rarr; or A / D</div>
  <div><span>Jump:</span> Space / Up / W</div>
  <div><span>Run / Dash:</span> Shift / X</div>
  <div><span>Fireball:</span> F / Ctrl / C</div>
  <div><span>Restart:</span> R</div>
  <div><span>Mute:</span> M</div>
</div>

<script>
// --- AUDIO SYNTHESIZER (8-bit WebAudio) ---
class RetroAudio {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.bgmPlaying = false;
    this.bgmTimer = null;
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playJump() {
    if (this.muted) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    const now = this.ctx.currentTime;
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(620, now + 0.22);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.22);
  }

  playCoin() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(987.77, now); // B5
    osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  }

  playStomp() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  }

  playKick() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(450, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.18);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.18);
  }

  playBump() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }

  playPowerUp() {
    if (this.muted) return;
    this.init();
    const notes = [330, 392, 659, 523, 587, 784];
    const now = this.ctx.currentTime;
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, now + idx * 0.08);
      gain.gain.setValueAtTime(0.25, now + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.08);
      osc.stop(now + idx * 0.08 + 0.08);
    });
  }

  playPowerDown() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.5);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.5);
  }

  playFireball() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  }

  playBrickBreak() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const bufferSize = this.ctx.sampleRate * 0.25;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    noise.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);
  }

  playDie() {
    if (this.muted) return;
    this.stopBgm();
    this.init();
    const notes = [493.88, 698.46, 698.46, 698.46, 659.25, 587.33, 523.25];
    const lens = [0.18, 0.14, 0.14, 0.2, 0.2, 0.2, 0.4];
    const now = this.ctx.currentTime;
    let t = now;
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + lens[i]);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + lens[i]);
      t += lens[i];
    });
  }

  playStageClear() {
    if (this.muted) return;
    this.stopBgm();
    this.init();
    const notes = [392, 523, 659, 784, 1046, 784, 1046];
    const now = this.ctx.currentTime;
    let t = now;
    notes.forEach((f) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.25);
      t += 0.22;
    });
  }

  startBgm() {
    if (this.bgmPlaying || this.muted) return;
    this.init();
    this.bgmPlaying = true;
    const melody = [
      659.25, 659.25, 0, 659.25, 0, 523.25, 659.25, 0, 783.99, 0, 0, 0, 392.00, 0, 0, 0,
      523.25, 0, 0, 392.00, 0, 0, 329.63, 0, 0, 440.00, 0, 493.88, 0, 466.16, 440.00, 0,
      392.00, 659.25, 783.99, 880.00, 0, 698.46, 783.99, 0, 659.25, 0, 523.25, 587.33, 493.88, 0
    ];
    let step = 0;
    this.bgmTimer = setInterval(() => {
      if (!this.bgmPlaying || this.muted) return;
      const freq = melody[step];
      if (freq > 0) {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
      step = (step + 1) % melody.length;
    }, 130);
  }

  stopBgm() {
    this.bgmPlaying = false;
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.bgmTimer = null;
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.muted) this.stopBgm();
    else this.startBgm();
  }
}

const audio = new RetroAudio();

// --- GAME ENGINE SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const TILE_SIZE = 32;
const GRAVITY = 0.55;
const LEVEL_WIDTH = 215 * TILE_SIZE;
const GROUND_Y = 12 * TILE_SIZE;

// Keyboard input state
const keys = {
  left: false,
  right: false,
  up: false,
  down: false,
  run: false,
  jump: false
};

let jumpBufferTimer = 0;
let coyoteTimer = 0;

window.addEventListener('keydown', (e) => {
  audio.init();
  if (!audio.bgmPlaying && !audio.muted) audio.startBgm();

  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
    jumpBufferTimer = 0.2; // 200ms jump buffer
    if (!keys.jump && mario) mario.tryJump();
    keys.jump = true;
    keys.up = true;
  }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX') keys.run = true;
  if (e.code === 'KeyF' || e.code === 'ControlLeft' || e.code === 'KeyC') {
    if (mario && mario.state === 'fire') mario.shootFireball();
  }
  if (e.code === 'KeyR') resetGame();
  if (e.code === 'KeyM') audio.toggleMute();
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
    keys.jump = false;
    keys.up = false;
  }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX') keys.run = false;
});

// --- GAME STATE ---
let currentLevel = 1;
let score = 0;
let coins = 0;
let lives = 3;
let timeRemaining = 400;
let gameOver = false;
let levelClear = false;
let gameWon = false;
let cameraX = 0;

// Entities
let mario;
let enemies = [];
let blocks = [];
let particles = [];
let items = [];
let fireballs = [];
let pipes = [];
let piranhas = [];
let groundSegments = [];
let collectibleCoins = [];
let levelTheme = 'overworld'; // overworld, underground, sky

// --- COLLECTIBLE COIN CLASS ---
class CollectibleCoin {
  constructor(tileX, tileY) {
    this.x = tileX * TILE_SIZE + 6;
    this.y = tileY * TILE_SIZE + 4;
    this.w = 20;
    this.h = 24;
    this.baseY = this.y;
    this.collected = false;
    this.bobTimer = Math.random() * Math.PI * 2;
  }

  update() {
    this.bobTimer += 0.08;
    this.y = this.baseY + Math.sin(this.bobTimer) * 4;

    if (!this.collected && mario && !mario.dead && mario.intersects(this)) {
      this.collect();
    }
  }

  collect() {
    this.collected = true;
    score += 200;
    coins++;
    if (coins >= 100) {
      coins -= 100;
      lives++;
      audio.playPowerUp();
    }
    audio.playCoin();
    particles.push(new CoinParticle(this.x + 2, this.y - 12));
    const idx = collectibleCoins.indexOf(this);
    if (idx !== -1) collectibleCoins.splice(idx, 1);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(Math.floor(this.x + this.w / 2), Math.floor(this.y + this.h / 2));
    const scaleX = Math.cos(this.bobTimer * 1.6);
    ctx.scale(scaleX, 1);

    // Coin outer
    ctx.fillStyle = '#fcd800';
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Darker gold border
    ctx.strokeStyle = '#c68400';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Inner sparkle
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-2, -7, 3, 14);

    ctx.restore();
  }
}

// --- MARIO CLASS ---
class Mario {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.w = 28;
    this.h = 32;
    this.state = 'small'; // small, super, fire
    this.facing = 1;
    this.grounded = false;
    this.dead = false;
    this.invincible = false;
    this.invincibleTimer = 0;
    this.walkFrame = 0;
    this.walkTimer = 0;
    this.slidingPole = false;
    this.walkingToCastle = false;
  }

  update() {
    if (this.dead) {
      this.vy += GRAVITY;
      this.y += this.vy;
      return;
    }

    if (this.slidingPole) {
      this.y += 3.5;
      if (this.y >= GROUND_Y - this.h) {
        this.y = GROUND_Y - this.h;
        this.slidingPole = false;
        this.walkingToCastle = true;
        this.facing = 1;
        audio.playStageClear();
      }
      return;
    }

    if (this.walkingToCastle) {
      this.x += 2.5;
      this.walkTimer += 0.2;
      if (this.x >= 204 * TILE_SIZE) {
        this.walkingToCastle = false;
        levelClear = true;
        
        // Auto-advance to next level after brief delay
        setTimeout(() => {
          if (currentLevel < 3) {
            currentLevel++;
            levelClear = false;
            initWorld(currentLevel);
            audio.startBgm();
          } else {
            gameWon = true;
          }
        }, 2200);
      }
      return;
    }

    // Invincibility flicker timer
    if (this.invincible) {
      this.invincibleTimer -= 1/60;
      if (this.invincibleTimer <= 0) this.invincible = false;
    }

    // Coyote timer
    if (this.grounded) {
      coyoteTimer = 0.15;
    } else {
      coyoteTimer -= 1/60;
    }

    // Jump buffer check
    if (jumpBufferTimer > 0) {
      jumpBufferTimer -= 1/60;
      if (this.grounded || coyoteTimer > 0) {
        this.tryJump();
        jumpBufferTimer = 0;
      }
    }

    // Horizontal Movement
    const maxSpeed = keys.run ? 6.5 : 4.0;
    const accel = 0.35;
    const friction = 0.84;

    if (keys.left) {
      this.vx -= accel;
      this.facing = -1;
    } else if (keys.right) {
      this.vx += accel;
      this.facing = 1;
    } else {
      this.vx *= friction;
      if (Math.abs(this.vx) < 0.1) this.vx = 0;
    }

    this.vx = Math.max(Math.min(this.vx, maxSpeed), -maxSpeed);

    // Variable jump gravity
    if (this.vy < 0 && !keys.jump) {
      this.vy += GRAVITY * 1.5;
    } else {
      this.vy += GRAVITY;
    }

    // Move X & Collide
    this.x += this.vx;
    this.collideX();

    // Move Y & Collide
    this.y += this.vy;
    this.grounded = false;
    this.collideY();

    // Bottom pit check
    if (this.y > canvas.height + 60 && !this.dead) {
      this.die();
    }

    // Animation frame timer
    if (this.grounded && Math.abs(this.vx) > 0.2) {
      this.walkTimer += Math.abs(this.vx) * 0.05;
      this.walkFrame = Math.floor(this.walkTimer) % 3;
    } else {
      this.walkFrame = 0;
    }
  }

  tryJump() {
    if ((this.grounded || coyoteTimer > 0) && !this.dead && !this.slidingPole && !this.walkingToCastle) {
      // High jump velocity to clear 3-tile and 4-tile pipes with ease!
      this.vy = -15.2;
      this.grounded = false;
      coyoteTimer = 0;
      audio.playJump();
    }
  }

  bounce(force = -9.5) {
    this.vy = force;
    audio.playStomp();
  }

  shootFireball() {
    if (fireballs.length >= 2) return;
    fireballs.push(new Fireball(this.x + (this.facing > 0 ? this.w : -12), this.y + 12, this.facing));
    audio.playFireball();
  }

  grow() {
    if (this.state === 'small') {
      this.state = 'super';
      this.h = 56;
      this.y -= 24;
      audio.playPowerUp();
    } else {
      audio.playCoin();
    }
  }

  getFireFlower() {
    if (this.state === 'small') {
      this.h = 56;
      this.y -= 24;
    }
    this.state = 'fire';
    audio.playPowerUp();
  }

  takeDamage() {
    if (this.invincible || this.dead) return;

    if (this.state === 'fire') {
      this.state = 'super';
      this.invincible = true;
      this.invincibleTimer = 2.0;
      audio.playPowerDown();
    } else if (this.state === 'super') {
      this.state = 'small';
      this.h = 32;
      this.invincible = true;
      this.invincibleTimer = 2.0;
      audio.playPowerDown();
    } else {
      this.die();
    }
  }

  die() {
    if (this.dead) return;
    this.dead = true;
    this.vx = 0;
    this.vy = -12;
    audio.playDie();
    lives--;
    setTimeout(() => {
      if (lives > 0) resetLevel();
      else gameOver = true;
    }, 2800);
  }

  collideX() {
    // Keep Mario from walking back past camera edge
    if (this.x < cameraX) {
      this.x = cameraX;
      this.vx = 0;
    }

    for (let b of blocks) {
      if (this.intersects(b)) {
        if (this.vx > 0) this.x = b.x - this.w;
        else if (this.vx < 0) this.x = b.x + b.w;
        this.vx = 0;
      }
    }

    // Pipes collision - allows gliding over pipes in mid-air
    for (let p of pipes) {
      if (this.intersects(p)) {
        // Step assist: If feet are within 14px of pipe top, land on top instead of blocking!
        if (this.y + this.h <= p.y + 14 && this.vy >= -1) {
          this.y = p.y - this.h;
          this.vy = 0;
          this.grounded = true;
          continue;
        }

        if (this.vx > 0) this.x = p.x - this.w;
        else if (this.vx < 0) this.x = p.x + p.w;

        if (this.grounded) {
          this.vx = 0;
        } else {
          // Mid-air: preserve sliding forward so jumping over pipe 2/3 is smooth and easy!
          this.vx *= 0.75;
        }
      }
    }
  }

  collideY() {
    // Ground collision
    for (let g of groundSegments) {
      if (this.x + this.w > g.x && this.x < g.x + g.w) {
        if (this.y + this.h >= g.y && this.y + this.h - this.vy <= g.y + 14) {
          this.y = g.y - this.h;
          this.vy = 0;
          this.grounded = true;
        }
      }
    }

    // Pipes collision
    for (let p of pipes) {
      if (this.intersects(p)) {
        if (this.vy > 0 && this.y + this.h - this.vy <= p.y + 16) {
          this.y = p.y - this.h;
          this.vy = 0;
          this.grounded = true;
        } else if (this.vy < 0) {
          this.y = p.y + p.h;
          this.vy = 0;
        }
      }
    }

    // Blocks collision
    for (let b of blocks) {
      if (this.intersects(b)) {
        if (this.vy > 0 && this.y + this.h - this.vy <= b.y + 12) {
          this.y = b.y - this.h;
          this.vy = 0;
          this.grounded = true;
        } else if (this.vy < 0) {
          this.y = b.y + b.h;
          this.vy = 0;
          b.hit(this);
        }
      }
    }
  }

  intersects(box) {
    return this.x < box.x + box.w &&
           this.x + this.w > box.x &&
           this.y < box.y + box.h &&
           this.y + this.h > box.y;
  }

  draw(ctx) {
    if (this.invincible && Math.floor(Date.now() / 80) % 2 === 0) return;

    ctx.save();
    ctx.translate(Math.floor(this.x), Math.floor(this.y));
    if (this.facing < 0) {
      ctx.scale(-1, 1);
      ctx.translate(-this.w, 0);
    }

    const cHat = this.state === 'fire' ? '#ffffff' : '#e52521';
    const cOveralls = this.state === 'fire' ? '#e52521' : '#0038a8';
    const cSkin = '#fcbc78';
    const cShoes = '#885014';

    if (this.state === 'small') {
      // Small Mario (28x32)
      ctx.fillStyle = cHat;
      ctx.fillRect(6, 0, 16, 6);
      ctx.fillRect(4, 6, 20, 4);
      ctx.fillStyle = cSkin;
      ctx.fillRect(6, 10, 14, 8);
      ctx.fillStyle = cShoes;
      ctx.fillRect(4, 10, 4, 6); // hair
      ctx.fillRect(14, 12, 4, 3); // mustache
      ctx.fillStyle = cOveralls;
      ctx.fillRect(4, 18, 18, 8);
      ctx.fillStyle = cHat;
      ctx.fillRect(8, 18, 10, 4);
      ctx.fillStyle = cShoes;
      if (this.grounded && Math.abs(this.vx) > 0.2 && this.walkFrame === 1) {
        ctx.fillRect(0, 26, 10, 6);
        ctx.fillRect(16, 26, 10, 6);
      } else {
        ctx.fillRect(2, 26, 10, 6);
        ctx.fillRect(14, 26, 10, 6);
      }
    } else {
      // Super / Fire Mario (28x56)
      ctx.fillStyle = cHat;
      ctx.fillRect(6, 0, 18, 10);
      ctx.fillRect(4, 10, 22, 6);
      ctx.fillStyle = cSkin;
      ctx.fillRect(8, 16, 16, 12);
      ctx.fillStyle = cShoes;
      ctx.fillRect(4, 16, 4, 8); // hair
      ctx.fillRect(16, 20, 6, 4); // mustache
      ctx.fillStyle = cHat;
      ctx.fillRect(4, 28, 20, 14);
      ctx.fillStyle = cOveralls;
      ctx.fillRect(6, 32, 16, 16);
      ctx.fillStyle = '#fcd800';
      ctx.fillRect(8, 34, 3, 3);
      ctx.fillRect(17, 34, 3, 3);
      ctx.fillStyle = cShoes;
      if (this.grounded && Math.abs(this.vx) > 0.2 && this.walkFrame === 1) {
        ctx.fillRect(0, 48, 12, 8);
        ctx.fillRect(16, 48, 12, 8);
      } else {
        ctx.fillRect(2, 48, 11, 8);
        ctx.fillRect(15, 48, 11, 8);
      }
    }

    ctx.restore();
  }
}

// --- BLOCKS (Question & Brick) ---
class Block {
  constructor(x, y, type, content = 'coin') {
    this.x = x * TILE_SIZE;
    this.y = y * TILE_SIZE;
    this.w = TILE_SIZE;
    this.h = TILE_SIZE;
    this.type = type; // 'question', 'brick', 'empty'
    this.content = content; // 'coin', 'mushroom', 'none'
    this.bouncing = false;
    this.bounceOffset = 0;
  }

  hit(mario) {
    if (this.type === 'empty') {
      audio.playBump();
      return;
    }

    if (this.type === 'question') {
      this.bounce();
      audio.playBump();
      this.type = 'empty';

      if (this.content === 'coin') {
        score += 200;
        coins++;
        audio.playCoin();
        particles.push(new CoinParticle(this.x + 8, this.y - 16));
      } else if (this.content === 'mushroom') {
        const itemType = mario.state === 'small' ? 'mushroom' : 'flower';
        items.push(new PowerupItem(this.x, this.y - TILE_SIZE, itemType));
        audio.playPowerUp();
      }
    } else if (this.type === 'brick') {
      if (mario.state === 'small') {
        this.bounce();
        audio.playBump();
      } else {
        audio.playBrickBreak();
        score += 50;
        this.shatter();
      }
    }
  }

  bounce() {
    this.bouncing = true;
    let t = 0;
    const interval = setInterval(() => {
      t += 0.25;
      this.bounceOffset = -Math.sin(t * Math.PI) * 10;
      if (t >= 1.0) {
        clearInterval(interval);
        this.bounceOffset = 0;
        this.bouncing = false;
      }
    }, 20);
  }

  shatter() {
    const idx = blocks.indexOf(this);
    if (idx !== -1) blocks.splice(idx, 1);

    const vels = [
      { vx: -3, vy: -8 }, { vx: 3, vy: -8 },
      { vx: -2, vy: -4 }, { vx: 2, vy: -4 }
    ];
    vels.forEach(v => {
      particles.push(new DebrisParticle(this.x + 8, this.y + 8, v.vx, v.vy));
    });
  }

  draw(ctx) {
    const renderY = this.y + this.bounceOffset;
    const brickColor = (levelTheme === 'underground') ? '#0058a8' : (levelTheme === 'sky') ? '#b45020' : '#b44a00';

    if (this.type === 'question') {
      ctx.fillStyle = '#fc9838';
      ctx.fillRect(this.x, renderY, this.w, this.h);
      ctx.fillStyle = '#fce4a0';
      ctx.fillRect(this.x + 2, renderY + 2, this.w - 4, this.h - 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(this.x, renderY, 2, this.h);
      ctx.fillRect(this.x + this.w - 2, renderY, 2, this.h);
      ctx.fillRect(this.x, renderY + this.h - 2, this.w, 2);

      ctx.font = 'bold 20px monospace';
      ctx.fillStyle = '#884400';
      ctx.fillText('?', this.x + 10, renderY + 24);
    } else if (this.type === 'empty') {
      ctx.fillStyle = (levelTheme === 'underground') ? '#002850' : '#884400';
      ctx.fillRect(this.x, renderY, this.w, this.h);
      ctx.fillStyle = '#222';
      ctx.fillRect(this.x + 3, renderY + 3, this.w - 6, this.h - 6);
    } else if (this.type === 'brick') {
      ctx.fillStyle = brickColor;
      ctx.fillRect(this.x, renderY, this.w, this.h);
      ctx.fillStyle = '#000';
      ctx.fillRect(this.x, renderY + 15, this.w, 2);
      ctx.fillRect(this.x + 15, renderY, 2, 15);
      ctx.fillRect(this.x + 8, renderY + 16, 2, 16);
      ctx.fillRect(this.x + 24, renderY + 16, 2, 16);
    }
  }
}

// --- ENEMIES (Goomba & Koopa) ---
class Enemy {
  constructor(x, y, type) {
    this.x = x * TILE_SIZE;
    this.y = y * TILE_SIZE;
    this.type = type; // 'goomba', 'koopa'
    this.w = 30;
    this.h = type === 'koopa' ? 44 : 30;
    this.vx = -1.2;
    this.vy = 0;
    this.dead = false;
    this.squished = false;
    this.inShell = false;
    this.shellMoving = false;
    this.frame = 0;
    this.frameTimer = 0;
  }

  update() {
    if (this.dead) {
      this.vy += GRAVITY;
      this.y += this.vy;
      return;
    }

    if (this.squished) return;

    if (this.type === 'koopa' && this.inShell) {
      if (this.shellMoving) {
        this.x += this.vx;
        this.collideWalls();
      }
      return;
    }

    // Walking
    this.x += this.vx;
    this.collideWalls();

    // Check collision with Mario
    if (mario && mario.intersects(this) && !mario.dead) {
      if (mario.vy > 0 && mario.y + mario.h - mario.vy <= this.y + 16) {
        mario.bounce();
        this.stomp();
      } else {
        if (this.inShell && !this.shellMoving) {
          this.shellMoving = true;
          this.vx = mario.x < this.x ? 9 : -9;
          audio.playKick();
        } else {
          mario.takeDamage();
        }
      }
    }

    this.frameTimer += 0.08;
    if (this.frameTimer >= 1) {
      this.frameTimer = 0;
      this.frame = 1 - this.frame;
    }
  }

  collideWalls() {
    for (let p of pipes) {
      if (this.intersects(p)) {
        if (this.vx > 0) { this.x = p.x - this.w; this.vx = -this.vx; }
        else if (this.vx < 0) { this.x = p.x + p.w; this.vx = -this.vx; }
      }
    }
    for (let b of blocks) {
      if (this.intersects(b)) {
        if (this.vx > 0) { this.x = b.x - this.w; this.vx = -this.vx; }
        else if (this.vx < 0) { this.x = b.x + b.w; this.vx = -this.vx; }
      }
    }
  }

  stomp() {
    if (this.type === 'goomba') {
      this.squished = true;
      score += 100;
      audio.playStomp();
      setTimeout(() => {
        const idx = enemies.indexOf(this);
        if (idx !== -1) enemies.splice(idx, 1);
      }, 400);
    } else if (this.type === 'koopa') {
      if (!this.inShell) {
        this.inShell = true;
        this.h = 30;
        this.y += 14;
        this.vx = 0;
        score += 200;
      } else {
        this.shellMoving = !this.shellMoving;
        if (this.shellMoving) this.vx = 9;
      }
    }
  }

  hitByFireball() {
    this.dead = true;
    this.vy = -7;
    score += 100;
    audio.playKick();
  }

  intersects(box) {
    return this.x < box.x + box.w &&
           this.x + this.w > box.x &&
           this.y < box.y + box.h &&
           this.y + this.h > box.y;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(Math.floor(this.x), Math.floor(this.y));

    if (this.type === 'goomba') {
      const gColor = (levelTheme === 'underground') ? '#0070c0' : '#a84400';
      if (this.squished) {
        ctx.fillStyle = gColor;
        ctx.fillRect(0, 18, 30, 12);
        ctx.fillStyle = '#000';
        ctx.fillRect(6, 22, 6, 3);
        ctx.fillRect(18, 22, 6, 3);
      } else {
        ctx.fillStyle = gColor;
        ctx.beginPath();
        ctx.arc(15, 12, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(6, 8, 4, 8);
        ctx.fillRect(20, 8, 4, 8);
        ctx.fillStyle = '#000';
        ctx.fillRect(8, 10, 2, 4);
        ctx.fillRect(20, 10, 2, 4);
        ctx.fillStyle = '#fcbc78';
        ctx.fillRect(8, 18, 14, 6);
        ctx.fillStyle = '#000';
        if (this.frame === 0) {
          ctx.fillRect(2, 24, 10, 6);
          ctx.fillRect(18, 24, 10, 6);
        } else {
          ctx.fillRect(4, 24, 10, 6);
          ctx.fillRect(16, 24, 10, 6);
        }
      }
    } else if (this.type === 'koopa') {
      const shellColor = (levelTheme === 'underground') ? '#0088cc' : '#00a800';
      if (this.inShell) {
        ctx.fillStyle = shellColor;
        ctx.beginPath();
        ctx.arc(15, 15, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(5, 10, 20, 10);
        ctx.fillStyle = '#000';
        ctx.fillRect(8, 13, 14, 4);
      } else {
        ctx.fillStyle = '#fcbc78';
        ctx.fillRect(2, 0, 16, 14);
        ctx.fillStyle = '#000';
        ctx.fillRect(6, 4, 3, 4);
        ctx.fillStyle = shellColor;
        ctx.fillRect(8, 14, 18, 20);
        ctx.fillStyle = '#fcbc78';
        if (this.frame === 0) {
          ctx.fillRect(4, 34, 10, 8);
          ctx.fillRect(16, 34, 10, 8);
        } else {
          ctx.fillRect(6, 34, 10, 8);
          ctx.fillRect(14, 34, 10, 8);
        }
      }
    }

    ctx.restore();
  }
}

// --- PIRANHA PLANT ---
class PiranhaPlant {
  constructor(pipeX, pipeY, pipeHeight) {
    this.x = pipeX * TILE_SIZE + 10;
    this.baseY = pipeY * TILE_SIZE;
    this.y = this.baseY;
    this.w = 28;
    this.h = 36;
    this.state = 'hidden';
    this.timer = 0;
  }

  update() {
    this.timer++;
    const distToMario = Math.abs(mario ? (mario.x - this.x) : 999);

    if (this.state === 'hidden') {
      if (this.timer > 140 && distToMario > 48) {
        this.state = 'rising';
        this.timer = 0;
      }
    } else if (this.state === 'rising') {
      this.y -= 1.2;
      if (this.y <= this.baseY - 36) {
        this.y = this.baseY - 36;
        this.state = 'biting';
        this.timer = 0;
      }
    } else if (this.state === 'biting') {
      if (this.timer > 80) {
        this.state = 'lowering';
        this.timer = 0;
      }
    } else if (this.state === 'lowering') {
      this.y += 1.2;
      if (this.y >= this.baseY) {
        this.y = this.baseY;
        this.state = 'hidden';
        this.timer = 0;
      }
    }

    // Collision with Mario
    if (this.state !== 'hidden' && mario && !mario.dead) {
      if (mario.x < this.x + this.w && mario.x + mario.w > this.x &&
          mario.y < this.y + this.h && mario.y + mario.h > this.y) {
        mario.takeDamage();
      }
    }
  }

  draw(ctx) {
    if (this.state === 'hidden') return;
    ctx.fillStyle = '#e52521';
    ctx.beginPath();
    ctx.arc(this.x + 14, this.y + 14, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x + 8, this.y + 8, 4, 0, Math.PI * 2);
    ctx.arc(this.x + 20, this.y + 16, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#00a800';
    ctx.fillRect(this.x + 10, this.y + 24, 8, 12);
  }
}

// --- POWERUP ITEMS (Mushroom & Flower) ---
class PowerupItem {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.w = 28;
    this.h = 28;
    this.type = type;
    this.vx = type === 'mushroom' ? 1.5 : 0;
    this.vy = 0;
    this.grounded = false;
  }

  update() {
    if (this.type === 'mushroom') {
      this.vy += GRAVITY;
      this.x += this.vx;
      this.y += this.vy;

      // Ground collision
      for (let g of groundSegments) {
        if (this.x + this.w > g.x && this.x < g.x + g.w) {
          if (this.y + this.h >= g.y && this.y + this.h - this.vy <= g.y + 10) {
            this.y = g.y - this.h;
            this.vy = 0;
            this.grounded = true;
          }
        }
      }

      // Pipe bounce
      for (let p of pipes) {
        if (this.x < p.x + p.w && this.x + this.w > p.x &&
            this.y < p.y + p.h && this.y + this.h > p.y) {
          this.vx = -this.vx;
        }
      }
    }

    // Mario collection
    if (mario && mario.intersects(this)) {
      if (this.type === 'mushroom') {
        mario.grow();
        score += 1000;
      } else if (this.type === 'flower') {
        mario.getFireFlower();
        score += 1000;
      }
      const idx = items.indexOf(this);
      if (idx !== -1) items.splice(idx, 1);
    }
  }

  draw(ctx) {
    if (this.type === 'mushroom') {
      ctx.fillStyle = '#e52521';
      ctx.beginPath();
      ctx.arc(this.x + 14, this.y + 12, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.x + 14, this.y + 8, 4, 0, Math.PI * 2);
      ctx.arc(this.x + 6, this.y + 14, 3, 0, Math.PI * 2);
      ctx.arc(this.x + 22, this.y + 14, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fcbc78';
      ctx.fillRect(this.x + 6, this.y + 16, 16, 12);
    } else if (this.type === 'flower') {
      ctx.fillStyle = '#ff8800';
      ctx.beginPath();
      ctx.arc(this.x + 14, this.y + 14, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.x + 14, this.y + 14, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// --- FIREBALL ---
class Fireball {
  constructor(x, y, dir) {
    this.x = x;
    this.y = y;
    this.w = 12;
    this.h = 12;
    this.vx = dir * 7.5;
    this.vy = 3;
  }

  update() {
    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;

    // Ground bounce
    for (let g of groundSegments) {
      if (this.x + this.w > g.x && this.x < g.x + g.w) {
        if (this.y + this.h >= g.y) {
          this.y = g.y - this.h;
          this.vy = -5.5;
        }
      }
    }

    // Pipe explode
    for (let p of pipes) {
      if (this.x < p.x + p.w && this.x + this.w > p.x &&
          this.y < p.y + p.h && this.y + this.h > p.y) {
        this.destroy();
        return;
      }
    }

    // Kill Enemies
    for (let e of enemies) {
      if (!e.dead && this.x < e.x + e.w && this.x + this.w > e.x &&
          this.y < e.y + e.h && this.y + this.h > e.y) {
        e.hitByFireball();
        this.destroy();
        return;
      }
    }

    if (this.x > cameraX + canvas.width || this.y > canvas.height) {
      this.destroy();
    }
  }

  destroy() {
    const idx = fireballs.indexOf(this);
    if (idx !== -1) fireballs.splice(idx, 1);
  }

  draw(ctx) {
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.arc(this.x + 6, this.y + 6, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e52521';
    ctx.beginPath();
    ctx.arc(this.x + 6, this.y + 6, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- PARTICLES ---
class CoinParticle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vy = -6;
    this.life = 0;
  }
  update() {
    this.y += this.vy;
    this.vy += 0.3;
    this.life++;
    if (this.life > 28) {
      const idx = particles.indexOf(this);
      if (idx !== -1) particles.splice(idx, 1);
    }
  }
  draw(ctx) {
    ctx.fillStyle = '#fcd800';
    ctx.fillRect(this.x, this.y, 16, 22);
    ctx.fillStyle = '#fff';
    ctx.fillRect(this.x + 4, this.y + 4, 8, 14);
  }
}

class DebrisParticle {
  constructor(x, y, vx, vy) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.life = 0;
  }
  update() {
    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;
    this.life++;
    if (this.life > 40) {
      const idx = particles.indexOf(this);
      if (idx !== -1) particles.splice(idx, 1);
    }
  }
  draw(ctx) {
    ctx.fillStyle = (levelTheme === 'underground') ? '#0058a8' : '#b44a00';
    ctx.fillRect(this.x, this.y, 8, 8);
  }
}

// --- LEVEL BUILDER & INITIALIZATION ---
function addPipe(xTile, heightTile, hasPiranha = true) {
  const p = {
    x: xTile * TILE_SIZE,
    y: GROUND_Y - heightTile * TILE_SIZE,
    w: 2 * TILE_SIZE,
    h: heightTile * TILE_SIZE
  };
  pipes.push(p);
  if (hasPiranha) {
    piranhas.push(new PiranhaPlant(xTile, GROUND_Y / TILE_SIZE - heightTile, heightTile));
  }
}

function addStaircase(startX, steps, ascending = true) {
  for (let s = 0; s < steps; s++) {
    const h = ascending ? (s + 1) : (steps - s);
    const x = startX + s;
    for (let y = 0; y < h; y++) {
      blocks.push(new Block(x, 11 - y, 'brick'));
    }
  }
}

function initWorld(level = 1) {
  currentLevel = level;
  document.getElementById('header-title').innerHTML = 'SUPER UNITY in 2D &bull; WORLD 1-' + currentLevel;
  
  const container = document.getElementById('canvas-container');

  cameraX = 0;
  enemies = [];
  blocks = [];
  particles = [];
  items = [];
  fireballs = [];
  pipes = [];
  piranhas = [];
  collectibleCoins = [];
  groundSegments = [];
  timeRemaining = 400;
  levelClear = false;

  mario = new Mario(80, GROUND_Y - 40);

  if (currentLevel === 1) {
    // === WORLD 1-1 (CLASSIC OVERWORLD) ===
    levelTheme = 'overworld';
    container.style.background = '#5c94fc';

    groundSegments = [
      { x: 0, w: 69 * TILE_SIZE, y: GROUND_Y },
      { x: 71 * TILE_SIZE, w: 15 * TILE_SIZE, y: GROUND_Y },
      { x: 89 * TILE_SIZE, w: 64 * TILE_SIZE, y: GROUND_Y },
      { x: 155 * TILE_SIZE, w: 60 * TILE_SIZE, y: GROUND_Y }
    ];

    // Starting Coins right at spawn! (x=4 to 10)
    for (let cx = 4; cx <= 10; cx++) {
      collectibleCoins.push(new CollectibleCoin(cx, 10));
    }

    // Question & Brick blocks
    blocks.push(new Block(16, 8, 'question', 'coin'));
    blocks.push(new Block(20, 8, 'brick'));
    blocks.push(new Block(21, 8, 'question', 'mushroom'));
    blocks.push(new Block(22, 8, 'brick'));
    blocks.push(new Block(23, 8, 'question', 'coin'));
    blocks.push(new Block(24, 8, 'brick'));
    blocks.push(new Block(22, 4, 'question', 'coin'));

    // Pipes (Height 2, 3, 4)
    addPipe(28, 2, true);
    addPipe(38, 3, true);
    addPipe(46, 4, true);
    addPipe(57, 4, false);

    // Coins arching over pipes
    collectibleCoins.push(new CollectibleCoin(28, 7));
    collectibleCoins.push(new CollectibleCoin(29, 7));
    collectibleCoins.push(new CollectibleCoin(38, 6));
    collectibleCoins.push(new CollectibleCoin(39, 6));
    collectibleCoins.push(new CollectibleCoin(46, 5));
    collectibleCoins.push(new CollectibleCoin(47, 5));

    // Enemies
    enemies.push(new Enemy(22, 11, 'goomba'));
    enemies.push(new Enemy(41, 11, 'goomba'));
    enemies.push(new Enemy(51, 11, 'goomba'));
    enemies.push(new Enemy(53, 11, 'goomba'));
    enemies.push(new Enemy(106, 10.5, 'koopa'));
    enemies.push(new Enemy(124, 11, 'goomba'));
    enemies.push(new Enemy(126, 11, 'goomba'));

    // High brick bridge
    blocks.push(new Block(77, 8, 'brick'));
    blocks.push(new Block(78, 8, 'question', 'mushroom'));
    blocks.push(new Block(79, 8, 'brick'));
    for (let bx = 80; bx <= 87; bx++) {
      blocks.push(new Block(bx, 4, 'brick'));
      collectibleCoins.push(new CollectibleCoin(bx, 2));
    }
    blocks.push(new Block(91, 4, 'brick'));
    blocks.push(new Block(92, 4, 'brick'));
    blocks.push(new Block(93, 4, 'brick'));
    blocks.push(new Block(94, 4, 'question', 'coin'));

    // Staircases
    addStaircase(134, 4, true);
    addStaircase(140, 4, false);
    addStaircase(148, 4, true);
    addStaircase(155, 4, false);
    addStaircase(181, 8, true);

  } else if (currentLevel === 2) {
    // === WORLD 1-2 (UNDERGROUND BLUE CAVE) ===
    levelTheme = 'underground';
    container.style.background = '#0a0d18';

    // Underground floor with pit gaps
    groundSegments = [
      { x: 0, w: 45 * TILE_SIZE, y: GROUND_Y },
      { x: 49 * TILE_SIZE, w: 35 * TILE_SIZE, y: GROUND_Y },
      { x: 88 * TILE_SIZE, w: 30 * TILE_SIZE, y: GROUND_Y },
      { x: 122 * TILE_SIZE, w: 25 * TILE_SIZE, y: GROUND_Y },
      { x: 151 * TILE_SIZE, w: 60 * TILE_SIZE, y: GROUND_Y }
    ];

    // Ceiling of blue blocks
    for (let cx = 0; cx < 205; cx += 2) {
      blocks.push(new Block(cx, 1, 'brick'));
    }

    // Starting Coins right at spawn!
    for (let cx = 4; cx <= 10; cx++) {
      collectibleCoins.push(new CollectibleCoin(cx, 10));
    }

    // Overhead coin gallery
    for (let cx = 15; cx <= 28; cx++) {
      collectibleCoins.push(new CollectibleCoin(cx, 4));
      if (cx % 3 === 0) blocks.push(new Block(cx, 5, 'brick'));
    }

    // Underground pipes
    addPipe(32, 3, true);
    addPipe(40, 4, true);
    addPipe(70, 3, true);
    addPipe(105, 4, true);
    addPipe(140, 2, false);

    // Underground enemies
    enemies.push(new Enemy(18, 11, 'goomba'));
    enemies.push(new Enemy(24, 11, 'goomba'));
    enemies.push(new Enemy(55, 11, 'koopa'));
    enemies.push(new Enemy(62, 11, 'goomba'));
    enemies.push(new Enemy(95, 11, 'goomba'));
    enemies.push(new Enemy(98, 11, 'goomba'));
    enemies.push(new Enemy(130, 11, 'koopa'));

    // Question & Brick clusters
    blocks.push(new Block(12, 8, 'question', 'mushroom'));
    blocks.push(new Block(13, 8, 'brick'));
    blocks.push(new Block(50, 7, 'question', 'coin'));
    blocks.push(new Block(52, 7, 'question', 'coin'));
    blocks.push(new Block(54, 7, 'question', 'coin'));

    // Floating stepping platforms across pits
    for (let px = 46; px <= 48; px++) blocks.push(new Block(px, 9, 'brick'));
    for (let px = 85; px <= 87; px++) blocks.push(new Block(px, 8, 'brick'));
    for (let px = 119; px <= 121; px++) blocks.push(new Block(px, 8, 'brick'));

    // Staircase to exit
    addStaircase(175, 7, true);

  } else if (currentLevel === 3) {
    // === WORLD 1-3 (ATHLETIC SKY BRIDGES) ===
    levelTheme = 'sky';
    container.style.background = '#6b98e8';

    // High floating platforms & cloud bridges
    groundSegments = [
      { x: 0, w: 22 * TILE_SIZE, y: GROUND_Y },
      { x: 26 * TILE_SIZE, w: 18 * TILE_SIZE, y: GROUND_Y - 2 * TILE_SIZE },
      { x: 48 * TILE_SIZE, w: 24 * TILE_SIZE, y: GROUND_Y },
      { x: 76 * TILE_SIZE, w: 20 * TILE_SIZE, y: GROUND_Y - 3 * TILE_SIZE },
      { x: 100 * TILE_SIZE, w: 22 * TILE_SIZE, y: GROUND_Y - 1 * TILE_SIZE },
      { x: 126 * TILE_SIZE, w: 26 * TILE_SIZE, y: GROUND_Y - 2 * TILE_SIZE },
      { x: 156 * TILE_SIZE, w: 56 * TILE_SIZE, y: GROUND_Y }
    ];

    // Starting Coins right at spawn!
    for (let cx = 4; cx <= 10; cx++) {
      collectibleCoins.push(new CollectibleCoin(cx, 10));
    }

    // High leap coin arcs
    for (let cx = 22; cx <= 25; cx++) collectibleCoins.push(new CollectibleCoin(cx, 8));
    for (let cx = 44; cx <= 47; cx++) collectibleCoins.push(new CollectibleCoin(cx, 7));
    for (let cx = 72; cx <= 75; cx++) collectibleCoins.push(new CollectibleCoin(cx, 6));
    for (let cx = 96; cx <= 99; cx++) collectibleCoins.push(new CollectibleCoin(cx, 7));

    // Sky mushroom platforms & question blocks
    blocks.push(new Block(30, 6, 'question', 'mushroom'));
    blocks.push(new Block(31, 6, 'brick'));
    blocks.push(new Block(32, 6, 'question', 'coin'));

    blocks.push(new Block(56, 5, 'brick'));
    blocks.push(new Block(57, 5, 'question', 'coin'));
    blocks.push(new Block(58, 5, 'brick'));

    blocks.push(new Block(82, 3, 'question', 'coin'));
    blocks.push(new Block(83, 3, 'question', 'coin'));

    // Koopa patrols on high platforms
    enemies.push(new Enemy(33, 8.5, 'koopa'));
    enemies.push(new Enemy(55, 10.5, 'koopa'));
    enemies.push(new Enemy(80, 7.5, 'koopa'));
    enemies.push(new Enemy(110, 9.5, 'koopa'));
    enemies.push(new Enemy(135, 8.5, 'koopa'));

    // Monumental grand staircase
    addStaircase(172, 9, true);
  }
}

function resetLevel() {
  mario = new Mario(cameraX + 40, GROUND_Y - 40);
  timeRemaining = 400;
  audio.startBgm();
}

function resetGame() {
  score = 0;
  coins = 0;
  lives = 3;
  timeRemaining = 400;
  gameOver = false;
  levelClear = false;
  gameWon = false;
  initWorld(1);
  audio.startBgm();
}

initWorld(1);

// --- GAME LOOP ---
let lastTime = performance.now();

function gameLoop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // Update timer
  if (!gameOver && !levelClear && !gameWon && mario && !mario.dead) {
    timeRemaining -= dt * 2.5;
    if (timeRemaining <= 0) {
      timeRemaining = 0;
      mario.die();
    }
  }

  // Update Entities
  if (mario) mario.update();
  enemies.forEach(e => e.update());
  items.forEach(i => i.update());
  fireballs.forEach(f => f.update());
  collectibleCoins.forEach(c => c.update());
  particles.forEach(p => p.update());
  piranhas.forEach(p => p.update());

  // Check Flagpole trigger (X = 198)
  const flagX = 198 * TILE_SIZE;
  if (mario && mario.x >= flagX && !mario.slidingPole && !mario.walkingToCastle && !levelClear && !gameWon) {
    mario.slidingPole = true;
    mario.vx = 0;
    mario.x = flagX - 8;
    score += 5000;
    audio.playKick();
  }

  // Camera Follow
  if (mario && mario.x - cameraX > 380) {
    cameraX = mario.x - 380;
  }
  cameraX = Math.max(0, Math.min(cameraX, LEVEL_WIDTH - canvas.width));

  // --- RENDER ---
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  // Draw Scenery (Clouds, Bushes, Hills)
  drawScenery(ctx);

  // Draw Ground Segments
  for (let g of groundSegments) {
    if (levelTheme === 'underground') {
      ctx.fillStyle = '#0058a8';
      ctx.fillRect(g.x, g.y, g.w, 8);
      ctx.fillStyle = '#002850';
      ctx.fillRect(g.x, g.y + 8, g.w, canvas.height - g.y);
    } else if (levelTheme === 'sky') {
      ctx.fillStyle = '#38a800';
      ctx.fillRect(g.x, g.y, g.w, 8);
      ctx.fillStyle = '#603010';
      ctx.fillRect(g.x, g.y + 8, g.w, canvas.height - g.y);
    } else {
      ctx.fillStyle = '#00a800'; // grass
      ctx.fillRect(g.x, g.y, g.w, 8);
      ctx.fillStyle = '#884400'; // dirt
      ctx.fillRect(g.x, g.y + 8, g.w, canvas.height - g.y);
    }
  }

  // Draw Pipes
  for (let p of pipes) {
    const pipeColor = (levelTheme === 'underground') ? '#006090' : '#00a800';
    const pipeDark = (levelTheme === 'underground') ? '#003050' : '#005800';

    ctx.fillStyle = pipeColor;
    ctx.fillRect(p.x + 4, p.y + 16, p.w - 8, p.h - 16);
    ctx.fillStyle = '#fff';
    ctx.fillRect(p.x + 8, p.y + 16, 4, p.h - 16);

    ctx.fillStyle = pipeColor;
    ctx.fillRect(p.x, p.y, p.w, 16);
    ctx.fillStyle = pipeDark;
    ctx.fillRect(p.x, p.y, p.w, 2);
    ctx.fillRect(p.x, p.y + 14, p.w, 2);
  }

  // Draw Flagpole & Castle
  drawFlagpoleAndCastle(ctx);

  // Draw Piranha Plants
  piranhas.forEach(p => p.draw(ctx));

  // Draw Blocks
  blocks.forEach(b => b.draw(ctx));

  // Draw Collectible Coins
  collectibleCoins.forEach(c => c.draw(ctx));

  // Draw Items
  items.forEach(i => i.draw(ctx));

  // Draw Enemies
  enemies.forEach(e => e.draw(ctx));

  // Draw Fireballs
  fireballs.forEach(f => f.draw(ctx));

  // Draw Mario
  if (mario) mario.draw(ctx);

  // Draw Particles
  particles.forEach(p => p.draw(ctx));

  ctx.restore();

  // Draw HUD Overlay
  drawHUD(ctx);

  if (gameOver) drawGameOver(ctx);
  if (levelClear && !gameWon) drawLevelClear(ctx);
  if (gameWon) drawGameWon(ctx);

  requestAnimationFrame(gameLoop);
}

function drawScenery(ctx) {
  if (levelTheme === 'overworld' || levelTheme === 'sky') {
    // Clouds
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    for (let cx = 100; cx < LEVEL_WIDTH; cx += 450) {
      ctx.beginPath();
      ctx.arc(cx, 80, 24, 0, Math.PI * 2);
      ctx.arc(cx + 20, 70, 30, 0, Math.PI * 2);
      ctx.arc(cx + 45, 80, 24, 0, Math.PI * 2);
      ctx.fill();
    }

    // Bushes
    ctx.fillStyle = '#008800';
    for (let bx = 160; bx < LEVEL_WIDTH; bx += 400) {
      ctx.beginPath();
      ctx.arc(bx, GROUND_Y - 4, 18, 0, Math.PI * 2);
      ctx.arc(bx + 20, GROUND_Y - 10, 24, 0, Math.PI * 2);
      ctx.arc(bx + 40, GROUND_Y - 4, 18, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (levelTheme === 'underground') {
    // Subterranean stalactites
    ctx.fillStyle = '#003870';
    for (let st = 80; st < LEVEL_WIDTH; st += 320) {
      ctx.beginPath();
      ctx.moveTo(st, 32);
      ctx.lineTo(st + 15, 75);
      ctx.lineTo(st + 30, 32);
      ctx.fill();
    }
  }
}

function drawFlagpoleAndCastle(ctx) {
  const fx = 198 * TILE_SIZE;
  ctx.fillStyle = '#008800';
  ctx.fillRect(fx - 4, GROUND_Y - 16, 24, 16);
  ctx.fillStyle = '#fff';
  ctx.fillRect(fx + 6, GROUND_Y - 300, 4, 284);
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(fx + 8, GROUND_Y - 302, 8, 0, Math.PI * 2);
  ctx.fill();

  const flagY = (mario && mario.slidingPole) ? mario.y : GROUND_Y - 290;
  ctx.fillStyle = '#00a800';
  ctx.beginPath();
  ctx.moveTo(fx + 6, flagY);
  ctx.lineTo(fx - 32, flagY + 16);
  ctx.lineTo(fx + 6, flagY + 32);
  ctx.fill();

  const cx = 203 * TILE_SIZE;
  const cy = GROUND_Y - 140;
  ctx.fillStyle = (levelTheme === 'underground') ? '#004880' : '#b44a00';
  ctx.fillRect(cx, cy, 140, 140);
  ctx.fillRect(cx + 20, cy - 40, 100, 40);
  ctx.fillRect(cx, cy - 14, 24, 14);
  ctx.fillRect(cx + 40, cy - 14, 24, 14);
  ctx.fillRect(cx + 80, cy - 14, 24, 14);
  ctx.fillRect(cx + 116, cy - 14, 24, 14);
  ctx.fillStyle = '#000';
  ctx.fillRect(cx + 50, GROUND_Y - 50, 40, 50);
}

function drawHUD(ctx) {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'left';

  // MARIO & Score
  ctx.fillText('MARIO', 60, 32);
  ctx.fillText(String(score).padStart(6, '0'), 60, 56);

  // COINS
  ctx.fillText('COINS', 280, 32);
  ctx.fillText('x' + String(coins).padStart(2, '0'), 280, 56);

  // WORLD
  ctx.fillText('WORLD', 500, 32);
  ctx.fillText('1-' + currentLevel, 500, 56);

  // TIME
  ctx.fillText('TIME', 720, 32);
  ctx.fillText(String(Math.ceil(timeRemaining)).padStart(3, '0'), 720, 56);

  // LIVES
  ctx.fillText('x' + lives, 880, 56);
  ctx.fillStyle = '#e52521';
  ctx.fillRect(860, 42, 14, 14);
}

function drawGameOver(ctx) {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fce4a0';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('PRESS [R] TO RESTART', canvas.width / 2, canvas.height / 2 + 35);
}

function drawLevelClear(ctx) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 44px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('STAGE CLEAR!', canvas.width / 2, canvas.height / 2 - 30);
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('WORLD 1-' + currentLevel + ' COMPLETED!', canvas.width / 2, canvas.height / 2 + 15);
  ctx.fillStyle = '#80ff80';
  ctx.fillText('ADVANCING TO WORLD 1-' + (currentLevel + 1) + '...', canvas.width / 2, canvas.height / 2 + 55);
}

function drawGameWon(ctx) {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 44px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('ALL WORLDS CLEARED!', canvas.width / 2, canvas.height / 2 - 40);
  ctx.font = 'bold 24px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('CONGRATULATIONS!', canvas.width / 2, canvas.height / 2 + 10);
  ctx.fillStyle = '#ff99dd';
  ctx.fillText('YOU RESCUED PRINCESS PEACH!', canvas.width / 2, canvas.height / 2 + 50);
  ctx.font = 'bold 18px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText('PRESS [R] TO PLAY AGAIN', canvas.width / 2, canvas.height / 2 + 95);
}

requestAnimationFrame(gameLoop);
</script>
